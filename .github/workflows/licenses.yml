name: Licenses

on:
  push:
    branches:
      - main
    paths:
      - 'webapp/package.json'
      - 'webapp/yarn.lock'
      - 'infrastructure/package.json'
      - 'infrastructure/yarn.lock'
      - 'scripts/licenses-report.mjs'
      - '.github/workflows/licenses.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'webapp/package.json'
      - 'webapp/yarn.lock'
      - 'infrastructure/package.json'
      - 'infrastructure/yarn.lock'
      - 'scripts/licenses-report.mjs'
      - '.github/workflows/licenses.yml'
  workflow_dispatch:

permissions:
  contents: read

# This workflow only lists which licenses are used. The WebApp workflow checks them before deploying.
jobs:
  webapp:
    name: WebApp
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webapp
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Enable corepack
      run: corepack enable
    - uses: actions/setup-node@v6
      env:
        yarn: 4.18.1
      with:
        node-version: 26
        cache: 'yarn'
        cache-dependency-path: './webapp/yarn.lock'
    - name: Install dependencies
      run: yarn install
    - name: List production and development licenses
      run: |
        echo "# WebApp" >> "$GITHUB_STEP_SUMMARY"
        yarn run licenses:report >> "$GITHUB_STEP_SUMMARY"
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infrastructure
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    - name: Enable corepack
      run: corepack enable
    - uses: actions/setup-node@v6
      env:
        yarn: 4.18.1
      with:
        node-version: 26
        cache: 'yarn'
        cache-dependency-path: './infrastructure/yarn.lock'
    - name: Install dependencies
      run: yarn install
    - name: List production and development licenses
      run: |
        echo "# Infrastructure" >> "$GITHUB_STEP_SUMMARY"
        yarn run licenses:report >> "$GITHUB_STEP_SUMMARY"
