enum EventType @aws_api_key {
  SINGLES
  DOUBLES
}

type Event @aws_api_key {
  id: ID!
  _id: ID!
  eventType: EventType!
  name: String!
  description: String
  date: AWSDate!
  time: AWSTime!
  maxPlayers: Int!
  place: String!
  court: String!
  ownerId: ID!
  createdAt: AWSDateTime!
}

input CreateGuestEventInput {
  eventType: EventType!
  name: String!
  description: String
  date: AWSDate!
  time: AWSTime!
  maxPlayers: Int!
  place: String!
  court: String!
  guestEmail: AWSEmail!
  guestName: String!
}

type Query {
  placeholder: String
}

type Mutation {
  createGuestEvent(input: CreateGuestEventInput!): Event! @aws_api_key
}

schema {
  query: Query
  mutation: Mutation
}
