enum EventType @aws_api_key {
  SINGLES
  DOUBLES
}

type Player @aws_api_key {
  id: ID!
  name: String!
  email: AWSEmail!
  role: String!
  status: String!
  team: String
  joinedAt: AWSDateTime!
}

type Event @aws_api_key {
  id: ID!
  _id: ID!
  eventType: EventType!
  name: String!
  description: String
  date: AWSDate!
  time: AWSTime!
  maxPlayers: Int!
  place: String!
  court: String!
  ownerId: ID!
  createdAt: AWSDateTime!
  players: [Player!]!
}

input CreateGuestEventInput {
  eventType: EventType!
  name: String!
  description: String
  date: AWSDate!
  time: AWSTime!
  maxPlayers: Int!
  place: String!
  court: String!
  guestEmail: AWSEmail!
  guestName: String!
}

input AddGuestPlayerInput {
  eventId: ID!
  guestEmail: AWSEmail!
  guestName: String!
  team: String
}

type AddGuestPlayerResponse @aws_api_key {
  guestId: ID!
  success: Boolean!
}

type Query {
  event(id: ID!): Event! @aws_api_key
  placeholder: String
}

type Mutation {
  createGuestEvent(input: CreateGuestEventInput!): Event! @aws_api_key
  addGuestPlayer(input: AddGuestPlayerInput!): AddGuestPlayerResponse! @aws_api_key
}

schema {
  query: Query
  mutation: Mutation
}
